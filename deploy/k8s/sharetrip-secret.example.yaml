# Secret template with placeholders only — copy to sharetrip-secret.yaml locally (do not commit secrets).
apiVersion: v1
kind: Secret
metadata:
  name: sharetrip-secret
  namespace: sharetrip
type: Opaque
stringData:
  DATABASE_DSN: "postgres://sharetrip:<password>@postgres:5432/sharetrip?sslmode=disable"
  KEYCLOAK_CLIENT_SECRET: "<keycloak-client-secret>"
